[resource]
name = "tailscale_device_key"
description = "Manages a device's key properties (e.g. expiry-disabled flag)."
category = "devices"

[crud]
create_endpoint = "/api/v2/device/{deviceId}/key"
update_endpoint = "/api/v2/device/{deviceId}/key"
read_endpoint   = "/api/v2/device/{deviceId}"
delete_endpoint = "/api/v2/device/{deviceId}/key"

[identity]
id_field = "id"
import_field = "device_id"
force_new_fields = ["device_id"]

[fields.device_id]
type = "String"
required = true
description = "Device to update key properties of."

[fields.key_expiry_disabled]
type = "Boolean"
required = false
description = "Whether the device's key expiry is disabled. Defaults to false."
