[resource]
name = "tailscale_device_tags"
description = "Tags applied to a Tailscale device. Tags drive ACL grants and group ownership."
category = "devices"

[crud]
create_endpoint = "/api/v2/device/{deviceId}/tags"
update_endpoint = "/api/v2/device/{deviceId}/tags"
read_endpoint   = "/api/v2/device/{deviceId}"
delete_endpoint = "/api/v2/device/{deviceId}/tags"

[identity]
id_field = "id"
import_field = "device_id"
force_new_fields = ["device_id"]

[fields.device_id]
type = "String"
required = true
description = "Device to set tags for."

[fields.tags]
type = "List"
required = true
description = "Set of tags to apply (e.g. tag:server, tag:dev)."
