[resource]
name = "tailscale_dns_search_paths"
description = "Additional DNS search domains for the tailnet (legacy — prefer dns_configuration)."
category = "dns"

[crud]
create_endpoint = "/api/v2/tailnet/{tailnet}/dns/searchpaths"
update_endpoint = "/api/v2/tailnet/{tailnet}/dns/searchpaths"
read_endpoint   = "/api/v2/tailnet/{tailnet}/dns/searchpaths"
delete_endpoint = "/api/v2/tailnet/{tailnet}/dns/searchpaths"

[identity]
id_field = "id"
import_field = "id"
force_new_fields = []

[fields.search_paths]
type = "List"
required = true
description = "DNS search-path domains appended on devices."
